name: Auto Claim Games

on:
  schedule:
    - cron: '0 16 * * *' # Каждый день в 19:00 по МСК
  workflow_dispatch:

jobs:
  claim:
    runs-on: ubuntu-latest
    steps:
      - name: Claim Games
        uses: actions/checkout@v4
      
      - name: Run Claimer Script
        uses: m9rco/epicgames-claimer-action@master
        with:
          epic_email: ${{ secrets.EG_EMAIL }}
          epic_password: ${{ secrets.EG_PASSWORD }}
          epic_totp_secret: ${{ secrets.EG_OTPKEY }}

name: Auto Claim Games

on:
  schedule:
    - cron: '0 16 * * *' # Запуск каждый день в 19:00 по МСК
  workflow_dispatch: # Кнопка для ручного запуска

jobs:
  claim:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci || npm install
          npx playwright install firefox --with-deps

      - name: Run Epic Games Claimer
        env:
          EG_EMAIL: ${{ secrets.EG_EMAIL }}
          EG_PASSWORD: ${{ secrets.EG_PASSWORD }}
          EG_OTPKEY: ${{ secrets.EG_OTPKEY }}
          SHOW: 0
          NODE_ENV: production
        run: node src/epic-games.js || node epic-games.js
